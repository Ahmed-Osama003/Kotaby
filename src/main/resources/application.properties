spring.application.name=Kotaby
# Data Base
spring.datasource.url=jdbc:mysql://kotaby-db.cju2mukiua2b.eu-north-1.rds.amazonaws.com:3306/kotaby?createDatabaseIfNotExist=true&useSSL=true&requireSSL=true&serverTimezone=UTC
spring.datasource.username=admin
spring.datasource.password=KotabyPassword
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# multipart file upload properties
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
logging.level.root=ERROR

# Swagger
springdoc.info.title=Kotaby API
springdoc.info.version=1.0.0
springdoc.info.description=API for managing Kotaby resources.